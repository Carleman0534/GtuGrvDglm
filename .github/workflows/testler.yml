# 🧪 Otomatik Testler
#
# Her gönderimde (push) ve çekme isteğinde tahmin motoru ile Adalet Simülatörü testlerini çalıştırır.
# Bir test başarısız olursa GitHub'da "Actions" sekmesinde kırmızı ✖ görünür.
# Yerelde çalıştırmak için: Testleri_Calistir.bat  veya  npm test

name: Testler

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Europe/Istanbul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "tests/*.test.js"
