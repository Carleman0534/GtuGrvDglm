# ⏱️ Sınav Süresi Onay Hatırlatıcısı
#
# Her 15 dakikada bir, bitmiş ve süresi onaylanmamış sınavların gözetmenlerine e-posta ve
# telefon bildirimi gönderir. Site kapalıyken de çalışır. Ayrıntılar: .github/scripts/sure-hatirlatma.mjs
#
# Kurulum (bir kez):
#   1. Gönderen Gmail hesabında 2 Adımlı Doğrulama açık olmalı.
#      https://myaccount.google.com/apppasswords adresinden bir "Uygulama şifresi" oluşturun.
#   2. GitHub'da depo → Settings → Secrets and variables → Actions → New repository secret:
#        GMAIL_USER          gönderen Gmail adresi
#        GMAIL_APP_PASSWORD  oluşturduğunuz 16 haneli uygulama şifresi
#   3. Telefon bildirimi için (isteğe bağlı) aynı yerden:
#        VAPID_PUBLIC_KEY    sitedeki açık anahtar (notification_engine.js içindeki VAPID_PUBLIC_KEY ile aynı)
#        VAPID_PRIVATE_KEY   gizli anahtar (depoya asla yazılmaz)
#   4. Actions sekmesinden "Süre Onayı Hatırlatıcısı" → Run workflow ile deneyin.
#
# Hiçbir sır tanımlı değilse iş akışı deneme modunda çalışır ve hiçbir şey göndermez.
# Yalnızca e-posta ya da yalnızca telefon bildirimi sırları da tek başına çalışır.
# Gönderim kaydı "durum" dalındaki hatirlatma.json dosyasında tutulur (siteyi etkilemez).
#
# Panelden gönderilen yönetici duyuruları da (son 3 gün, "cihaz bildirimi" açık) bu iş akışıyla
# telefon bildirimine kayıtlı cihazlara gönderilir.
#
# ⚠️ Zamanlama: GitHub "schedule" tetikleyicisini yoğunlukta saatlerce erteler (bu depoda 37 saatte
# yalnızca 7 kez çalıştı). Dakikasında çalışması için ücretsiz cron-job.org ile 5 dakikada bir tetikleyin:
#   1. GitHub → sağ üst profil → Settings → Developer settings → Personal access tokens →
#      Fine-grained tokens → Generate new token
#        Repository access: Only select repositories → GtuGrvDglm
#        Permissions → Repository permissions → Actions: Read and write   (başka izin vermeyin)
#        Expiration: en fazla 1 yıl (süresi dolunca yenileyin)
#   2. https://cron-job.org → ücretsiz hesap → CREATE CRONJOB
#        URL:      https://api.github.com/repos/Carleman0534/GtuGrvDglm/actions/workflows/sure-hatirlatma.yml/dispatches
#        Schedule: Every 5 minutes
#        Advanced → Request method: POST
#        Advanced → Headers:
#          Accept: application/vnd.github+json
#          Authorization: Bearer <1. adımdaki token>
#          X-GitHub-Api-Version: 2022-11-28
#          Content-Type: application/json
#        Advanced → Request body: {"ref":"main"}
#      "Test run" yanıtı 204 olmalı; Actions sekmesinde "workflow_dispatch" ile yeni bir çalışma görünür.
# Aşağıdaki schedule, dış tetikleyici durursa yedek olarak kalır.

name: Süre Onayı Hatırlatıcısı

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Deneme modu (e-posta göndermeden yalnızca say)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sure-hatirlatma
  cancel-in-progress: false

jobs:
  hatirlat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gönderim kaydını al (durum dalı)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .durum && cd .durum
          git init -q
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin durum; then
            git checkout -q -b durum FETCH_HEAD
          else
            git checkout -q --orphan durum
          fi
          [ -f hatirlatma.json ] || echo '{}' > hatirlatma.json

      - name: E-posta ve bildirim kütüphanelerini kur
        run: npm install --no-save --no-audit --no-fund nodemailer@6.9.14 web-push@3.6.7

      - name: Hatırlatmaları gönder
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          STATE_FILE: .durum/hatirlatma.json
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node .github/scripts/sure-hatirlatma.mjs

      - name: Gönderim kaydını sakla
        if: always()
        run: |
          cd .durum
          git add hatirlatma.json
          if git diff --cached --quiet; then
            echo "Kayıtta değişiklik yok."
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Süre hatırlatma kaydı güncellendi"
            git push -q origin durum
          fi
